version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: resume-analyzer-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-model:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: resume-analyzer-ml
    restart: unless-stopped
    environment:
      USE_GEMINI_ROADMAP: ${USE_GEMINI_ROADMAP:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-8000}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-1}
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - ml-model
    environment:
      PORT: 8080
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: resume_analyzer
      JWT_SECRET: super_secure_jwt_secret_key
      CORS_ORIGIN: http://localhost:3000
      ML_SERVICE_URL: http://ml-model:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-analyzer-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    ports:
      - "3000:3000"

volumes:
  mongo_data:
